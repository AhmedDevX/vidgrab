name: Build binaries

# Build-only workflow: runs manually from the Actions tab ("Run workflow")
# and stores VidGrab.exe, the Android APKs, the license notices bundle and
# the GPL corresponding-source archives as workflow artifacts.
#
# Nothing is published automatically. Attaching these artifacts to a GitHub
# Release is a separate, manual step: download the artifacts, verify them,
# then create the release yourself and upload the files.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --console=plain

      - name: Fetch Android ffmpeg corresponding source (FFmpeg n5.1)
        run: curl -fL https://ffmpeg.org/releases/ffmpeg-5.1.tar.xz -o ffmpeg-5.1-src.tar.xz

      - name: Bundle license notices
        run: zip -r VidGrab-NOTICES.zip LICENSE docs/CREDITS.md docs/licenses

      - name: Store APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Store notices + Android ffmpeg source as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-notices-and-source
          path: |
            VidGrab-NOTICES.zip
            ffmpeg-5.1-src.tar.xz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned ffmpeg (verified by SHA-256)
        run: |
          cd windows/vendor
          bash fetch_ffmpeg.sh

      - name: Install dependencies
        run: pip install -r windows/requirements.txt

      - name: Run tests
        run: |
          cd windows
          python -m pytest test_core.py test_share.py

      - name: Build VidGrab.exe
        run: |
          cd windows
          python -m PyInstaller vidgrab.spec

      - name: Fetch Windows ffmpeg corresponding source (FFmpeg @ 2a571b6068)
        run: curl -fL https://github.com/FFmpeg/FFmpeg/archive/2a571b606854520cf89804d8030c8b328e621689.tar.gz -o ffmpeg-2a571b6068-src.tar.gz

      - name: Bundle license notices
        shell: pwsh
        run: Compress-Archive -Path LICENSE, docs/CREDITS.md, docs/licenses -DestinationPath VidGrab-NOTICES.zip

      - name: Store exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/VidGrab.exe

      - name: Store notices + Windows ffmpeg source as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-notices-and-source
          path: |
            VidGrab-NOTICES.zip
            ffmpeg-2a571b6068-src.tar.gz
